name: Validate TAKY Mobile

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Guard Hide & Seek identity
        run: python tools/validate-hide-seek-name-purge.py
      - name: Check JavaScript syntax
        run: node --check src/app.js
      - name: Validate badge transport core
        run: node tools/test-badge-transport-core.mjs
      - name: Validate badge observation endpoint scaffold
        run: node tools/test-badge-observation-endpoint.mjs
      - name: Validate badge producer compatibility
        run: node tools/test-badge-producer-compatibility.mjs
      - name: Validate Netlify Blobs badge ledger
        run: node tools/test-badge-blobs-ledger.mjs
