name: Validate TAKY Mobile

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard Hide & Seek identity
        run: python tools/validate-hide-seek-name-purge.py
      - name: Check JavaScript syntax
        run: node --check src/app.js
