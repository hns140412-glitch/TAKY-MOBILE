<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#9CCBEB">
<title>TAKY 팀게임 · 참가</title>
<link rel="stylesheet" href="theme.css">
<style>
  html, body { overscroll-behavior: none; touch-action: manipulation; }
  body { --art: url(art/scenes/camp.webp); }
  [data-theme="island"] body { --veil: linear-gradient(180deg, rgba(255, 248, 234, 0) 0%, rgba(255, 248, 234, .18) 35%, rgba(250, 242, 222, .82) 78%); }
  [data-theme="island"] body.play { --veil: linear-gradient(180deg, rgba(255, 248, 234, .55), rgba(250, 242, 222, .88)); }
  .tabwrap { position: absolute; top: -22px; left: 0; right: 0; display: flex; justify-content: center; z-index: 2; pointer-events: none; }
  body { min-height: 100dvh; display: flex; flex-direction: column; user-select: none; -webkit-user-select: none; }
  .top, #v { position: relative; z-index: 1; } .top { z-index: 2; }
  .top { display: flex; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top)) 14px 8px; }
  .top .sp { flex: 1; }
  .badge { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px 0 4px; border-radius: var(--r-pill); background: var(--panel-solid); border: 1px solid var(--panel-line); box-shadow: var(--shadow-1); font-weight: var(--fw-strong); max-width: 64%; overflow: hidden; }
  .badge .face { position: relative; width: 36px; height: 36px; border-radius: 50%; overflow: hidden; flex: none; display: grid; place-items: center; }
  .badge .face .ava { position: absolute; top: 1px; left: 50%; height: 96px !important; max-width: none; filter: none; transform: translateX(-50%); }
  .badge .face .emb { box-shadow: none; }
  .badge span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .score { display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 14px; border-radius: var(--r-pill); background: var(--navy); color: var(--navy-ink); font-family: var(--font-display); font-size: 20px; font-variant-numeric: tabular-nums; box-shadow: var(--btn-3d); }
  .score::before { content: "★"; color: var(--gold); font-size: 16px; }
  .net { width: 9px; height: 9px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px var(--panel-solid); } .net.off { background: var(--bad); }
  #v { flex: 1; display: flex; flex-direction: column; padding: 6px 14px calc(14px + env(safe-area-inset-bottom)); min-height: 0; }
  .center { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 12px; }
  h1 { font-size: 34px; } h2 { font-size: 26px; }
  .ico { width: 100%; height: 100%; display: block; }
  .itile { display: grid; place-items: center; width: 84px; height: 84px; padding: 14px; border-radius: 30%; background: var(--navy); color: var(--navy-ink); box-shadow: var(--btn-3d), var(--shadow-1); }

  /* join */
  .jcard { position: relative; width: 100%; padding: 30px 18px 18px; margin-top: 4px; }
  .jcard .banner { font-size: 19px; height: 42px; }
  .crewrow { display: flex; justify-content: center; align-items: flex-end; height: 150px; }
  .crewrow .ava { height: 130px; margin: 0 -14px; }
  .crewrow .ava:nth-child(2) { height: 150px; position: relative; z-index: 1; }
  .join { width: 100%; display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
  .join input { width: 100%; height: 60px; border-radius: var(--r-md); border: 2px solid var(--line); background: #fff; padding: 0 16px; font: inherit; font-size: 21px; font-weight: 700; color: #1E2B4A; text-align: center; }
  .sugg { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .sugg .chip { min-height: 44px; padding: 0 14px; }
  .crewpick { margin-top: 4px; }
  .cph { font-family: var(--font-display); font-weight: var(--fw-display); font-size: 20px; text-align: center; }
  .cps { text-align: center; font-size: 14px; margin-top: 2px; }
  .cgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
  .cc { position: relative; aspect-ratio: 1 / 1.1; min-height: 72px; border-radius: 14px; border: 2px solid var(--line); background: rgba(255,255,255,.75); display: flex; align-items: flex-end; justify-content: center; overflow: hidden; padding: 0; }
  .cc img { height: 96%; width: auto; pointer-events: none; }
  .cc.on { border: 3px solid var(--accent); background: #fff; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent), 0 4px 0 var(--btn-edge); transform: translateY(-2px); }
  .cc.on::after { content: '✓'; position: absolute; top: 4px; right: 6px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 14px; font-weight: 800; display: grid; place-items: center; }
  .cc[disabled] img { filter: grayscale(1); opacity: .35; }
  .cc .tk { position: absolute; left: 0; right: 0; top: 40%; text-align: center; font-size: 12px; font-weight: 800; color: #1E2B4A; background: rgba(255,255,255,.85); }
  .err { color: var(--bad); font-weight: 700; min-height: 1.4em; font-size: var(--fs-sm); }
  .big { width: 100%; min-height: 64px; font-size: 21px; }

  /* wait */
  .wait .orb { position: relative; display: flex; flex-direction: column; align-items: center; }
  .wait .orb .ava { height: min(36vh, 290px); animation: bob 2.4s ease-in-out infinite; position: relative; z-index: 1; }
  .wait .orb .emb { animation: bob 2.4s ease-in-out infinite; margin-bottom: 14px; position: relative; z-index: 1; }
  .wait .orb::after { content: ""; width: 220px; height: 30px; margin-top: -18px; border-radius: 50%; background: var(--ground, var(--surface-2)); box-shadow: inset 0 -6px 0 rgba(0, 0, 0, .08); }
  @keyframes bob { 50% { transform: translateY(-8px); } }
  .bubble { position: relative; background: var(--panel-solid); border: 1px solid var(--panel-line); box-shadow: var(--shadow-1); border-radius: 22px; padding: 10px 18px; font-family: var(--font-hand); font-size: 28px; line-height: 1.15; max-width: 300px; }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -10px; width: 18px; height: 18px; background: var(--panel-solid); border-right: 1px solid var(--panel-line); border-bottom: 1px solid var(--panel-line); transform: translateX(-50%) rotate(45deg); }
  .intro { position: relative; z-index: 1; color: var(--comic-ink); gap: 10px; }
  .intro h1 { font-size: 46px; color: var(--comic-ink); }
  .intro .how { font-family: var(--font-hand); font-size: 28px; line-height: 1.15; max-width: 300px; color: var(--comic-ink); }
  .intro .sw { position: relative; width: min(62vw, 240px, 34vh); aspect-ratio: 1; margin-top: 4px; }
  .intro .sw .stopwatch { width: 100%; height: 100%; filter: drop-shadow(0 8px 0 rgba(0, 0, 0, .12)); }
  .cd { position: absolute; left: 0; right: 0; top: 57%; transform: translateY(-50%); text-align: center; font-family: var(--font-display); font-size: min(17vw, 74px, 10vh); line-height: 1; color: #1E2B4A; }
  .card2.named { position: relative; padding: 30px 18px 14px; margin-top: 18px; }

  /* in-game */
  .hud { display: flex; align-items: center; gap: 10px; padding: 8px 12px; margin-bottom: 8px; border-radius: var(--r-md); }
  .hud .hi { width: 40px; height: 40px; padding: 6px; border-radius: 12px; background: var(--surface-2); flex: none; }
  .hud .hv { flex: 1; min-width: 0; font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; }
  .hud .hv small { display: block; font-size: 12px; color: var(--ink-soft); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hud .t { font-family: var(--font-display); font-size: 30px; font-variant-numeric: tabular-nums; }
  .tbar { height: 10px; border-radius: 99px; background: var(--bar-track); overflow: hidden; margin: 0 2px 12px; }
  .tbar i { display: block; height: 100%; width: 100%; background: var(--accent-2); border-radius: 99px; transform-origin: left; transition: transform 100ms linear; }
  .tbar.low i { background: var(--bad); }
  .hint { text-align: center; font-weight: 800; font-size: 22px; min-height: 1.5em; margin-bottom: 10px; }
  .hint b { font-family: var(--font-display); font-weight: 400; color: var(--accent); font-size: 34px; }
  .tapbtn { position: relative; flex: 1; width: 100%; border-radius: 36px; font-family: var(--font-display); font-size: 40px; box-shadow: inset 0 -14px 0 rgba(0, 0, 0, .16), inset 0 6px 0 rgba(255, 255, 255, .25), 0 10px 0 rgba(0, 0, 0, .22); transition: transform 60ms, box-shadow 60ms; display: grid; place-items: center; overflow: hidden; margin-bottom: 10px; }
  .tapbtn:active, .tapbtn.hit { transform: translateY(6px); box-shadow: inset 0 -8px 0 rgba(0, 0, 0, .16), inset 0 6px 0 rgba(255, 255, 255, .25), 0 4px 0 rgba(0, 0, 0, .22); }
  .tapbtn small { display: block; font-family: var(--font-ui); font-size: 15px; font-weight: 600; margin-top: 8px; }
  .tapbtn .peek { position: absolute; right: 8px; bottom: -6px; opacity: .95; pointer-events: none; }
  .tapbtn .peek .ava { height: 130px; }
  .tapbtn .cnt { display: block; font-size: 72px; line-height: 1; }
  .q { flex: 1; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .prompt { flex: 1; min-height: 150px; max-height: 46vh; display: grid; place-items: center; text-align: center; padding: 16px; position: relative; overflow: hidden; }
  .prompt .pb { font-size: 64px; line-height: 1.1; font-weight: 800; }
  .prompt .pb.long { font-size: 24px; line-height: 1.4; }
  .prompt .pb.mid { font-size: 32px; line-height: 1.25; }
  .prompt .clockface { display: block; margin: 0 auto; }
  .archery { display: grid; gap: 14px; padding: 10px 4px; text-align: center; }
  .bow { position: relative; height: 110px; border-radius: 55px; background: linear-gradient(90deg, #F2F2F2 0 10%, #1E2B4A 10% 22%, #3E7BFA 22% 34%, #E5484D 34% 44%, #F7C948 44% 56%, #E5484D 56% 66%, #3E7BFA 66% 78%, #1E2B4A 78% 90%, #F2F2F2 90%); box-shadow: inset 0 0 0 3px rgba(0,0,0,.25), var(--shadow-1); }
  .bow .mk { position: absolute; top: -10px; bottom: -10px; width: 6px; margin-left: -3px; border-radius: 3px; background: #111; box-shadow: 0 0 0 2px #fff; }
  .bow .hit { position: absolute; top: 44%; width: 12px; height: 12px; margin: -6px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px #111; }
  .arrows { display: flex; justify-content: center; gap: 8px; } .arrows span { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-size: 22px; background: var(--panel-solid); box-shadow: inset 0 0 0 2px var(--line); }
  .arrows span.shot { background: var(--gold); box-shadow: none; color: #1E2B4A; }
  .medals-me { display: flex; justify-content: center; gap: 14px; margin-top: 6px; } .medals-me span { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-display); font-size: 20px; }
  .together { margin-top: 8px; padding: 6px 10px; border-radius: 12px; background: color-mix(in srgb, var(--good, #2FA36B) 16%, transparent); color: var(--ink); font-weight: 700; }
  .choices.two.words .ch { font-size: 30px; }
  .prompt .ps { font-size: 16px; color: var(--ink-soft); margin-top: 8px; font-weight: 700; }
  .prompt.ok { animation: ok 380ms; } .prompt.no { animation: no 380ms; }
  @keyframes ok { 30% { background: color-mix(in srgb, var(--good) 28%, var(--panel-solid)); } }
  @keyframes no { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } 30% { background: color-mix(in srgb, var(--bad) 22%, var(--panel-solid)); } }
  .choices { display: grid; grid-template-columns: 1fr; gap: 9px; padding-bottom: 6px; }
  .choices.two { grid-template-columns: 1fr 1fr; }
  .choices.two .ch { min-height: 120px; font-size: 54px; font-family: var(--font-display); font-weight: 400; justify-content: center; padding: 0; }
  .choices.two .ch .k { display: none; }
  .ch { position: relative; display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 14px; text-align: left; border-radius: 16px; background: var(--btn-bg); border: 2px solid var(--btn-line); color: var(--btn-ink); font-size: 22px; font-weight: 800; box-shadow: inset 0 2px 0 rgba(255, 255, 255, .55), 0 4px 0 var(--btn-edge); transition: transform 60ms, box-shadow 60ms; }
  .ch:active { transform: translateY(4px); box-shadow: 0 0 0 var(--btn-edge); }
  .ch .k { width: 32px; height: 32px; border-radius: 50%; background: var(--pri-bg); color: var(--navy-ink); font-family: var(--font-display); font-size: 17px; font-weight: 400; display: grid; place-items: center; flex: none; box-shadow: 0 2px 0 var(--pri-edge); }
  .ch .mk { margin-left: auto; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; font-weight: 900; color: #fff; }
  .ch.yes { border-color: #2C7A47; } .ch.yes .mk { background: #2C7A47; }
  .ch.no { border-color: var(--bad); } .ch.no .mk { background: var(--bad); }
  .choices.two .ch .mk { position: absolute; top: 8px; right: 8px; }
  .lock { position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--panel-solid) 82%, transparent); font-weight: 800; color: var(--bad); font-size: 22px; }
  .grid { display: grid; gap: 10px; flex: 1; align-content: center; }
  .grid.g12, .grid.g9 { grid-template-columns: repeat(3, 1fr); }
  .cell { aspect-ratio: 1; border-radius: 20px; background: var(--panel-solid); border: 1px solid var(--panel-line); font-family: var(--font-display); font-size: 34px; box-shadow: 0 6px 0 var(--line), var(--shadow-1); transition: background 120ms, transform 80ms; }
  .grid.g12 .cell { aspect-ratio: 1.15; }
  .cell.gone { visibility: hidden; }
  .cell.lit { background: var(--gold); border-color: transparent; transform: translateY(-3px) scale(1.04); box-shadow: 0 6px 0 color-mix(in srgb, var(--gold) 60%, #000), 0 0 0 6px color-mix(in srgb, var(--gold) 30%, transparent); }
  .cell.bad { background: var(--bad); }
  .react { flex: 1; border-radius: 36px; display: grid; place-items: center; text-align: center; font-family: var(--font-display); font-size: 40px; color: #fff; padding: 20px; box-shadow: inset 0 -12px 0 rgba(0, 0, 0, .16), 0 8px 0 rgba(0, 0, 0, .22); margin-bottom: 8px; }
  .react.wait { background: var(--navy); } .react.go { background: var(--good); } .react.early { background: var(--bad); } .react.done { background: var(--accent-2); }
  .react small { display: block; font-family: var(--font-ui); font-size: 17px; font-weight: 600; margin-top: 10px; opacity: .92; }
  .res .stand { position: relative; display: flex; flex-direction: column; align-items: center; }
  .res .stand .ava { height: min(30vh, 240px); }
  .res .medal { position: absolute; right: -34px; top: 0; z-index: 2; filter: drop-shadow(0 4px 4px rgba(0, 0, 0, .25)); transform: rotate(8deg); }
  .res .place { font-family: var(--font-display); font-size: 74px; line-height: 1; color: var(--ink); text-decoration: underline; text-decoration-thickness: 8px; text-underline-offset: 10px; }
  .card2 { padding: 12px 18px; width: 100%; }
  .feet { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 10px; }
  .foot { border-radius: 30px; font-family: var(--font-display); font-size: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; box-shadow: inset 0 -12px 0 rgba(0, 0, 0, .16), inset 0 5px 0 rgba(255, 255, 255, .25), 0 8px 0 rgba(0, 0, 0, .22); transition: transform 60ms; }
  .foot .ico { width: 64px; height: 64px; }
  .foot.r { background: var(--pri-bg); color: var(--navy-ink); } .foot.r .ico { transform: scaleX(-1); }
  .foot.hit { transform: translateY(6px); } .foot.bad { animation: no 220ms; }
  .stopg { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; }
  .sw2 { position: relative; width: min(64vw, 250px, 36vh); aspect-ratio: 1; }
  .sw2 .stopwatch { width: 100%; height: 100%; filter: drop-shadow(0 8px 0 rgba(0, 0, 0, .1)); }
  .sw2 b { position: absolute; left: 0; right: 0; top: 57%; transform: translateY(-50%); font-family: var(--font-display); font-size: min(11vw, 44px); color: #1E2B4A; font-variant-numeric: tabular-nums; }
  .recs { font-weight: 700; font-size: var(--fs-sm); background: var(--panel-solid); padding: 6px 14px; border-radius: 999px; }
  .prize { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; background: rgba(20, 24, 50, .55); padding: 24px; }
  .prize .card { position: relative; width: 100%; max-width: 340px; padding: 40px 20px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .prize h2 { font-size: 34px; }
  .ring { font-family: var(--font-display); font-size: 26px; color: var(--accent); }
</style>
</head>
<body>
<div class="top"><div class="badge hidden" id="badge"><span class="face" id="bface"></span><span id="bname"></span></div><span class="sp"></span><span class="score hidden" id="bscore"></span><span class="net" id="net"></span></div>
<div id="v"></div>
<script src="net.js"></script>
<script src="ui.js"></script>
<script>
'use strict';
const $ = (s) => document.querySelector(s);
const V = $('#v');
const code = new URLSearchParams(location.search).get('r') || '';
const KEY = 'tg.player.' + code;
UI.setThemeAttr(store.get('tg.theme') || 'island');
let S = null, me = store.get(KEY), net, view = '', tick, pending = 0, flushT, lastDraw = null;
const buzz = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch { /* no vibration */ } };
const ava = (h) => UI.avatar(S.team, h, S.pack);
const learn = () => !S || S.pack !== 'event';


let offT = null; function netStatus(ok) { $('#net').classList.toggle('off', !ok); clearTimeout(offT); const b = document.getElementById('offline'); if (ok) { if (b) b.remove(); return; } offT = setTimeout(() => { if (!document.getElementById('offline')) document.body.insertAdjacentHTML('beforeend', '<div class="offline" id="offline" role="status">연결이 잠깐 끊겼어요 · 다시 잇는 중</div>'); }, 700); }
net = Net((n) => { if (me) n.send({ t: 'rejoin', code, teamId: me.teamId, token: me.token }); else renderJoin(); }, onMsg, netStatus);

function onMsg(m) {
  if (m.t === 'error') {
    if (m.code === 'NO_TEAM') { store.del(KEY); me = null; return renderJoin(); }
    if (m.code === 'NO_ROOM') { V.innerHTML = `<div class="center"><h2 class="display">방을 찾을 수 없어요</h2><p class="soft">진행 화면의 QR을 다시 찍어 주세요.</p></div>`; return; }
    const e = $('#err'); if (e) e.textContent = m.text; const b = $('#joinBtn'); if (b) b.disabled = false;
    if (m.code === 'CREW') { pickedCrew = null; peekRoom(); }
    return;
  }
  if (m.t === 'room') { roomInfo = m; if (m.theme) UI.setThemeAttr(m.theme); paintCrew(); return; }
  if (m.t === 'joined') { me = { teamId: m.teamId, token: m.token }; store.set(KEY, me); UI.sfx('join'); return; }
  if (m.t === 'kicked') { store.del(KEY); me = null; return renderJoin('진행자가 팀을 정리했어요. 다시 들어와 주세요.'); }
  if (m.t === 'progress') { if (S && S.round) { S.progress = m.progress; onProgress(); } return; }
  if (m.t !== 'state') return;
  const prevKey = view; S = m;
  if (S.theme) UI.setThemeAttr(S.theme);
  if (S.team) { $('#badge').classList.remove('hidden'); $('#bface').innerHTML = UI.avatar(S.team, S.pack === 'event' ? 36 : 56, S.pack); $('#bface').style.background = S.team.color; $('#bname').textContent = S.team.name; $('#bscore').classList.remove('hidden'); $('#bscore').textContent = S.team.score + '점'; }
  if (S.draw && S.draw.at !== lastDraw && S.now - S.draw.at < 20000) { lastDraw = S.draw.at; showPrize(); }
  const key = S.phase + ':' + (S.round ? S.round.startsAt : '') + ':' + (S.phase === 'final' ? S.revealStep : '');
  if (key !== prevKey) { view = key; render(); }
}

// ---------- join ----------
const NAMES = ['파도팀', '번개팀', '별빛팀', '고래팀', '무지개팀', '해바라기팀', '로켓팀', '등대팀', '나침반팀', '눈사람팀'];
function renderJoin(note) {
  view = 'join';
  const pick = [...Array(24).keys()].sort(() => Math.random() - .5).slice(0, 3).map((n) => `<img class="ava" src="art/crew/${String(n + 1).padStart(2, '0')}.webp" alt="">`).join('');
  V.innerHTML = `<div class="center"><div class="crewrow">${pick}</div>
    <div class="panel jcard"><div class="tabwrap"><span class="banner">${UI.icon('flag')}팀 등록 · 방 ${esc(code)}</span></div>
    <h1 class="display">우리 팀 이름은?</h1><p class="soft" style="margin-top:6px">팀마다 폰 한 대면 충분해요</p>
    <form class="join" id="jf"><input id="nm" maxlength="12" autocomplete="off" placeholder="예: 파도팀" aria-label="팀 이름">
    <div class="sugg">${NAMES.sort(() => Math.random() - .5).slice(0, 4).map((n) => `<button type="button" class="chip" data-n="${n}">${n}</button>`).join('')}</div>
    <div class="crewpick hidden" id="cp"><h2 class="cph">우리 팀 탐험대원 고르기</h2><p class="soft cps" id="cps">한 명을 골라 주세요 · 안 고르면 자동으로 정해져요</p><div class="cgrid" id="cg" role="radiogroup" aria-label="탐험대원"></div></div>

    if (results.length >= 5) { rx.className = 'react done'; rx.innerHTML = `다섯 번 끝!<small>평균 ${avg()}ms</small>`; return; }
    rx.className = 'react wait'; rx.innerHTML = `기다려요…<small>초록색이 되면 바로 눌러요</small>`; goAt = 0;
    clearTimeout(timer); timer = setTimeout(() => { if (!rx.isConnected) return; rx.className = 'react go'; rx.innerHTML = '지금!'; goAt = performance.now(); }, waits[k++ % waits.length]);
  };
  const avg = () => Math.round(results.reduce((a, b) => a + b, 0) / results.length);
  rx.addEventListener('pointerdown', (e) => {
    e.preventDefault(); if (rx.classList.contains('done') && results.length >= 5) return;
    if (!goAt) { clearTimeout(timer); rx.className = 'react early'; rx.innerHTML = '너무 빨랐어요!<small>다시 해요</small>'; buzz([40, 40]); UI.sfx('no'); setTimeout(() => rx.isConnected && arm(), 900); return; }
    const ms = Math.round(performance.now() - goAt); results.push(ms); net.send({ t: 'react', ms }); buzz(15); UI.sfx('ok');
    rx.className = 'react done'; rx.innerHTML = `${ms}ms<small>${results.length}/5</small>`; $('#hv').textContent = `평균 ${avg()}ms`; goAt = 0; setTimeout(() => rx.isConnected && arm(), 800);
  });
  arm(); runClock();
}
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
function showPrize() {
  const old = $('.prize'); if (old) old.remove();
  document.body.insertAdjacentHTML('beforeend', `<div class="prize" role="dialog" aria-label="경품 당첨"><div class="panel card"><div class="tabwrap"><span class="banner">${UI.icon('gift')}경품 추첨</span></div>${ava(S.pack === 'event' ? 110 : 200)}<h2 class="display">당첨이에요!</h2><p class="soft" style="font-weight:700">${esc(S.team.name)} · 진행자에게 받으러 가요</p><button class="btn cta big" id="prizeOk">좋아요</button></div></div>`);
  $('#prizeOk').onclick = () => $('.prize').remove();
  buzz([60, 60, 60, 60, 200]); UI.sfx('fanfare');
}

// result / final
const MEDAL = ['var(--gold)', 'var(--silver)', 'var(--bronze)'];
function standWith(place) { return `<div class="stand">${ava(S.pack === 'event' ? 130 : 240)}<span class="medal">${UI.rosette(place < 3 ? place : -1, 70)}</span></div>`; }
function resultScreen() {
  const r = S.lastResult, mine = r && r.mine;
  if (!mine || mine.place === null) return waitScreen('이번엔 쉬었어요. 다음엔 같이 해요!', '큰 화면을 봐 주세요');
  const words = S.mode === 'olympic' ? ['금메달!', '은메달!', '동메달!'] : S.mode === 'sports' ? ['1등 리본!', '2등 리본, 멋져요!', '3등 리본, 잘했어요!'] : ['우리가 1등!', '아주 잘했어요!', '멋져요, 3등!'];
  V.innerHTML = `<div class="center res">${standWith(mine.place)}<div class="place" style="text-decoration-color:${S.team.color}">${mine.place + 1}등</div><h2 class="display">${mine.place < 3 ? words[mine.place] : S.mode === 'olympic' ? '완주! 다음 종목을 노려요' : '끝까지 잘했어요!'}</h2>
    <div class="panel card2"><p class="ring">+${mine.points}점 · 지금 ${S.team.score}점</p><p class="soft" style="margin-top:4px">${esc(r.title)} · ${r.count}팀 중 ${mine.place + 1}등 · ${mine.value}${r.unit === 'ms' ? 'ms' : r.unit}</p>${myMedals()}${r.together ? `<p class="together">모든 탐험대가 끝까지 해냈어요! 다 함께 보너스 +2</p>` : ''}</div></div>`;
  buzz(mine.place === 0 ? [40, 60, 40, 60, 120] : 30);
}
function finalScreen() {
  const mine = S.final && S.final.find((x) => x.teamId === S.team.id), n = S.final ? S.final.length : 0;
  const shown = mine && n - mine.place <= S.revealStep;
  if (!shown) return waitScreen(pickLine(LINES.waitFinal), '최종 발표 중이에요');
  V.innerHTML = `<div class="center res">${standWith(mine.place)}<div class="place" style="text-decoration-color:${S.team.color}">${mine.place + 1}등</div><h2 class="display">${learn() ? (mine.place === 0 ? (S.mode === 'sports' ? '운동회 최고 탐험대!' : '오늘의 최고 탐험대!') : S.mode === 'sports' ? '운동회 완주!' : '탐험 수료!') : mine.place === 0 ? '우승이에요!' : '같이 놀아서 즐거웠어요'}</h2><div class="panel card2"><p class="ring">${S.team.score}점</p>${learn() && mine.praise ? `<p class="soft" style="margin-top:4px">${esc(mine.praise)}</p>` : ''}</div></div>`;
  buzz(mine.place === 0 ? [60, 60, 60, 60, 200] : 40);
  if (mine.place === 0) UI.sfx('fanfare');
}
</script>
