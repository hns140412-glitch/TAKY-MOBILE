<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>TAKY 가족 로그인</title>
<style>
:root{--bg:#fff9ec;--ink:#2d2a27;--muted:#6f655c;--accent:#398f83;--card:#ffffff}
@media (prefers-color-scheme:dark){:root{--bg:#1d1b19;--ink:#f3ede4;--muted:#b9afa4;--accent:#67c7b8;--card:#2a2724}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{width:min(440px,100%);background:var(--card);border-radius:24px;padding:24px;box-shadow:0 12px 40px rgba(0,0,0,.12)}
h1{margin:0 0 6px;font-size:22px}
p{margin:0 0 14px;color:var(--muted)}
#familyLogin{display:grid;gap:10px}
button{min-height:48px;border-radius:14px;border:2px solid var(--accent);background:transparent;color:var(--accent);font:inherit;font-weight:800;padding:0 16px}
button[hidden]{display:none}
#familyChooseTarget{display:grid;gap:8px}
#familyGoogleTarget:empty{display:none}
#familyLoginStatus{margin:0;font-size:14px}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
 <h1>TAKY 가족 로그인</h1>
 <p id="connectLead">한 번 로그인하면 이 기기의 TAKY 앱들이 함께 이어져요.</p>
 <div id="familyLogin">
  <button id="familySignInBtn" type="button" disabled>Google로 가족 로그인</button>
  <div id="familyGoogleTarget"></div>
  <div id="familyChooseTarget"></div>
  <p id="familyLoginStatus" role="status">확인 중…</p>
  <button id="familySignOutBtn" type="button" hidden>이 기기에서 로그아웃</button>
 </div>
 <p><a id="connectBack" href="#" hidden>앱으로 돌아가기</a></p>
</main>
<script type="module" src="/src/family-connect.mjs"></script>
</body>
</html>
